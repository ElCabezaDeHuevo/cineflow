name: CineFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/cineflow-security-invitations-2026-11-22", "feature/cineflow-unified-ux-redesign"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate Next.js types
        run: npx --no-install next typegen
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Build and TypeScript
        run: npm run build
